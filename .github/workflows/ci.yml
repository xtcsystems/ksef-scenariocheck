name: CI

on:
  push:
    branches: [main, probe/o-0001-public-core]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            executable: ksefguard
          - os: windows-2025
            rid: win-x64
            executable: ksefguard.exe
          - os: macos-15-intel
            rid: osx-x64
            executable: ksefguard
          - os: macos-15
            rid: osx-arm64
            executable: ksefguard
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore KsefGuard.sln
      - name: Verify formatting
        run: dotnet format KsefGuard.sln --verify-no-changes --no-restore
      - name: Build
        run: dotnet build KsefGuard.sln -c Release --no-restore
      - name: Core executable tests
        run: dotnet run --project tests/KsefGuard.Core.Tests -c Release --no-build
      - name: CLI executable tests
        run: dotnet run --project tests/KsefGuard.Cli.Tests -c Release --no-build
      - name: Publish self-contained binary
        shell: bash
        run: >-
          dotnet publish src/KsefGuard.Cli/KsefGuard.Cli.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o artifacts/${{ matrix.rid }}
      - name: Smoke release binary
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "artifacts/${{ matrix.rid }}/${{ matrix.executable }}" || true
          "artifacts/${{ matrix.rid }}/${{ matrix.executable }}" version
          "artifacts/${{ matrix.rid }}/${{ matrix.executable }}" scenarios list
          tmpdir="$(mktemp -d)"
          "artifacts/${{ matrix.rid }}/${{ matrix.executable }}" init --output "$tmpdir/pack"
          "artifacts/${{ matrix.rid }}/${{ matrix.executable }}" validate --pack "$tmpdir/pack" --output "$tmpdir/report"
          test -f "$tmpdir/report/report.json"
          test -f "$tmpdir/report/report.html"
      - uses: actions/upload-artifact@v4
        with:
          name: ksefguard-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          if-no-files-found: error
