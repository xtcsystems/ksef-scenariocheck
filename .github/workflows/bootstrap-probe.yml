name: Bootstrap probe source

on:
  push:
    branches:
      - probe/o-0001-public-core
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout probe branch
        uses: actions/checkout@v4
        with:
          ref: probe/o-0001-public-core
          fetch-depth: 0

      - name: Rehydrate bounded probe source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part* > /tmp/ksefguard.zip.b64
          base64 --decode /tmp/ksefguard.zip.b64 > /tmp/ksefguard.zip
          unzip -o /tmp/ksefguard.zip -d .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-probe.yml
          # The workflow token may not create or update workflow files. The
          # connected GitHub app will add the validated CI/release workflows
          # after this source commit is pushed.
          rm -f .github/workflows/ci.yml .github/workflows/release.yml

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and normalize formatting
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore KsefGuard.sln
          dotnet format KsefGuard.sln --no-restore

      - name: Build and run bounded acceptance harnesses
        shell: bash
        run: |
          set -euo pipefail
          dotnet build KsefGuard.sln -c Release --no-restore
          dotnet run --project tests/KsefGuard.Core.Tests/KsefGuard.Core.Tests.csproj -c Release --no-build
          dotnet run --project tests/KsefGuard.Cli.Tests/KsefGuard.Cli.Tests.csproj -c Release --no-build

      - name: Commit generated source to probe branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 1
          fi
          git commit -m 'Implement KSeF Guard public-core probe'
          git push origin HEAD:probe/o-0001-public-core
